{% extends "layout.html" %}

{% block content %}
<h2>Register Student</h2>
<p>Fill in the student's details and optionally provide a JSON transcript for the first semester.</p>
<form method="post">
    <label for="student_id">Student ID</label>
    <input type="text" id="student_id" name="student_id" required>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="program">Program</label>
    <input type="text" id="program" name="program" required>

    <label for="year">Year</label>
    <input type="number" id="year" name="year" min="1" required>

    <label for="document">Document JSON (optional)</label>
    <textarea id="document" name="document" placeholder='{"student_id": "S12345", "document_type": "transcript", "timestamp": "2025-08-09T00:00:00Z", "courses": [{"code": "CS101", "name": "Intro to CS", "grade": "A"}], "gpa": 4.0}'></textarea>

    <button type="submit">Register</button>
</form>
{% endblock %}
