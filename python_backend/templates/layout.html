<!DOCTYPE html>
<html>
  <head>
    <title>University Blockchain Demo</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 2em;
      }
      .nav {
        margin-bottom: 2em;
      }
      .nav a {
        margin-right: 2em;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('register') }}">Register Student</a>
      <a href="{{ url_for('view') }}">View Student</a>
      <a href="{{ url_for('ai') }}">AI/Chat</a>
    </div>
    {% with messages = get_flashed_messages() %} {% if messages %}{% for msg in
    messages %}
    <div style="color: green">{{ msg }}</div>
    {% endfor %}{% endif %} {% endwith %} {% block content %}{% endblock %}
  </body>
</html>
